    <script>
        try {
            var storedSettings = localStorage.getItem("portfolio-os-settings");
            var themeMode = "dark";
            if (storedSettings) {
                var parsedSettings = JSON.parse(storedSettings);
                if (parsedSettings.theme === "light") {
                    themeMode = "light";
                }
            }
            document.documentElement.classList.toggle("dark", themeMode === "dark");
        } catch (error) {
            document.documentElement.classList.add("dark");
        }
    </script>
